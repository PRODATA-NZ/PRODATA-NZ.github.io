title: "PRODATA TAPUI Ltd."
author: "PRODATA TAPUI Ltd."
name: "PRODATA TAPUI Ltd."
email: enquiries@prodata.nz
description: >-
  Custom software solutions and independent data consultancy for organisations
  across New Zealand.
baseurl: ""
url: "https://www.prodata.nz"
github_username: PRODATA-NZ

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "mint"
logo: /assets/images/logo.png
breadcrumbs: true
locale: "en-NZ"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-remote-theme

include:
  - _pages

collections:
  news:
    output: true
    permalink: /news/:name/
    sort_by: date
    sort_order: reverse
  articles:
    output: true
    permalink: /articles/:name/
    sort_by: date
    # sort_order: reverse

defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
  - scope:
      path: ""
      type: news
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
  - scope:
      path: ""
      type: articles
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      author_profile: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/PRODATA-NZ"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
